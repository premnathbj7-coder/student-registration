<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

```
<div class="container">

    <div class="header">
        <h1>Student Registration</h1>
        <p>Create your student account</p>
    </div>

    <form id="registrationForm">

        <h2>Personal Information</h2>

        <div class="row">
            <div class="input-group">
                <label>First Name</label>
                <input type="text" id="firstName" placeholder="Enter first name" required>
            </div>

            <div class="input-group">
                <label>Last Name</label>
                <input type="text" id="lastName" placeholder="Enter last name" required>
            </div>
        </div>

        <div class="row">
            <div class="input-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="Enter email" required>
            </div>

            <div class="input-group">
                <label>Mobile Number</label>
                <input type="tel" id="mobile" placeholder="Enter mobile number" required>
            </div>
        </div>

        <div class="row">
            <div class="input-group">
                <label>Date of Birth</label>
                <input type="date" id="dob" required>
            </div>

            <div class="input-group">
                <label>Gender</label>
                <select id="gender" required>
                    <option value="">Select Gender</option>
                    <option>Male</option>
                    <option>Female</option>
                    <option>Other</option>
                </select>
            </div>
        </div>

        <h2>Academic Information</h2>

        <div class="row">
            <div class="input-group">
                <label>Student ID</label>
                <input type="text" id="studentId" placeholder="Enter student ID" required>
            </div>

            <div class="input-group">
                <label>Department</label>
                <select id="department" required>
                    <option value="">Select Department</option>
                    <option>Computer Science</option>
                    <option>Information Technology</option>
                    <option>Artificial Intelligence & Data Science</option>
                    <option>Cyber Security</option>
                    <option>Electronics & Communication</option>
                    <option>Mechanical Engineering</option>
                </select>
            </div>
        </div>

        <div class="row">
            <div class="input-group">
                <label>Year</label>
                <select id="year" required>
                    <option value="">Select Year</option>
                    <option>1st Year</option>
                    <option>2nd Year</option>
                    <option>3rd Year</option>
                    <option>4th Year</option>
                </select>
            </div>

            <div class="input-group">
                <label>Course</label>
                <select id="course" required>
                    <option value="">Select Course</option>
                    <option>B.E Computer Science</option>
                    <option>B.Tech Information Technology</option>
                    <option>B.Tech AI & Data Science</option>
                    <option>B.Sc Computer Science</option>
                    <option>BCA</option>
                </select>
            </div>
        </div>

        <h2>Address</h2>

        <div class="input-group">
            <label>Address</label>
            <textarea id="address" placeholder="Enter your complete address" required></textarea>
        </div>

        <div class="row">
            <div class="input-group">
                <label>City</label>
                <input type="text" id="city" placeholder="Enter city" required>
            </div>

            <div class="input-group">
                <label>PIN Code</label>
                <input type="text" id="pincode" placeholder="Enter PIN code" required>
            </div>
        </div>

        <div class="buttons">
            <button type="reset" class="reset-btn">Clear</button>
            <button type="submit" class="submit-btn">Register Student</button>
        </div>

    </form>

    <div id="message"></div>

</div>

<script src="script.js"></script>
```

</body>
</html>
